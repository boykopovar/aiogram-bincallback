[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogram-bincallback"
version = "0.1.7"
description = "Binary CallbackData serialization for aiogram 3.x"
requires-python = ">=3.8"
dependencies = [
    "aiogram>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["aiogram_bincallback*"]
