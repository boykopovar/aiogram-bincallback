name: Test

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    name: Pytest & mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Run mypy
        run: python -m mypy
